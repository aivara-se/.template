name: validate

# `validate` runs on every pull request and is the check the default branch
# requires. Formatting is checked here. A repository adopting the template
# replaces the placeholder step with the commands under "Verify before pushing"
# in AGENTS.md.
on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Format
        run: bun fmt --no-script --check .

      - name: Placeholder
        run: echo "Replace this step with the repository's checks."
